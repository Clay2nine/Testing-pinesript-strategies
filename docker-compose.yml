version: "3.9"

services:
  webhook:
    build: .
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./logs:/app/logs
    # MT5 is Windows-only; on Linux use Wine or run natively on a Windows VPS.
    # On Windows, mount the MT5 terminal path:
    # volumes:
    #   - "C:/Program Files/BlackBull Markets MT5:/mt5:ro"
